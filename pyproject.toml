[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sae-emotion"
version = "0.1.0"
description = "Research code for causal sparse emotion features in language models"
readme = "README.md"
requires-python = ">=3.10"
# Exact recorded cluster versions are in requirements/ and environment/.
# Extras below describe capabilities; they are not an installation lock.
dependencies = []

[project.optional-dependencies]
research = [
  "torch", "transformers", "accelerate", "nnsight", "sae-lens",
  "numpy", "pandas", "scipy", "scikit-learn", "datasets",
  "tqdm", "requests", "matplotlib", "seaborn", "plotly", "statsmodels",
  "huggingface-hub", "safetensors"
]
preprocessing = ["numpy", "pandas", "scipy", "scikit-learn"]
notebooks = ["jupyterlab", "ipykernel"]
lora = ["peft"]

[tool.setuptools.packages.find]
where = ["src"]

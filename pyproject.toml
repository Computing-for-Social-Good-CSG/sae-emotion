[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sae-emotion"
version = "0.1.0"
description = "Research code for causal sparse emotion features in language models"
readme = "README.md"
requires-python = ">=3.10"
# Core research versions are pinned in requirements.txt.
# Extras below provide analysis and notebook dependencies.
dependencies = []

[project.optional-dependencies]
research = [
  "torch", "transformers", "accelerate", "nnsight", "sae-lens",
  "numpy", "pandas", "scipy", "scikit-learn", "datasets",
  "tqdm", "requests", "matplotlib", "seaborn", "plotly", "statsmodels",
  "huggingface-hub", "safetensors"
]
preprocessing = ["numpy", "pandas", "scipy", "scikit-learn"]
notebooks = ["jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
